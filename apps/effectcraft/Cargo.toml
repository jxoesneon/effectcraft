[package]
name = "effectcraft"
description = "EffectCraft: an open-source, sovereign motion graphics and visual effects compositor powered by Martensite"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "effectcraft"

[lints]
workspace = true

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-ui-martensite = { path = "../../crates/ui-martensite" }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for effectcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
