# Flatpak manifest for EffectCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/org.artcraft.app.yml
#   flatpak run org.artcraft.app
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
id: org.artcraft.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: effectcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Pictures is granted for opening files by
  # path from the command line.
  - --filesystem=xdg-pictures
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: effectcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/effectcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p effectcraft
      - install -Dm755 target/release/effectcraft /app/bin/effectcraft
      - install -Dm644 packaging/linux/ai.storyteller.effectcraft.desktop /app/share/applications/org.artcraft.app.desktop
      - install -Dm644 packaging/linux/ai.storyteller.effectcraft.mime.xml /app/share/mime/packages/org.artcraft.app.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/ && find /app/share/icons -type f -name 'ai.storyteller.effectcraft.*' | while read f; do mv "$f" "$(echo "$f" | sed 's/ai.storyteller.effectcraft/org.artcraft.app/')"; done
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.effectcraft.metainfo.xml.in > /app/share/metainfo/org.artcraft.app.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
