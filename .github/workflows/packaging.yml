name: Packaging

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3-pip flatpak flatpak-builder
          pip3 install aiohttp tomlkit --break-system-packages || pip3 install aiohttp tomlkit
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Vendor Cargo sources
        run: |
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.artcraft.app.flatpak
          manifest-path: packaging/flatpak/org.artcraft.app.yml
          cache-key: flatpak-builder-${{ github.sha }}
